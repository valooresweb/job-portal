name: CI/CD Deploy

on:
  workflow_dispatch:
 
jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        

      - name: Create directory
        run: |
          mkdir -p /home/Anthony/myapp

      - name: Copy directory
        run: |
          cp -r Anthony/myapp ./myapp

